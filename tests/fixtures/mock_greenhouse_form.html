<!doctype html>
<html><head><title>Apply</title></head>
<body>
<h1>Software Engineer, Payments</h1>
<form id="application" onsubmit="event.preventDefault(); document.body.innerHTML = '<h2>Thank you for applying!</h2>';">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" type="tel"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" type="file" required></div>
  <div class="field"><label for="li">LinkedIn Profile</label><input id="li"></div>
  <div class="field"><label for="hear">How did you hear about this job?</label><input id="hear"></div>
  <div class="field"><label for="why">Why do you want to work here? *</label><textarea id="why" required></textarea></div>
  <div class="field"><label for="auth">Are you legally authorized to work in the United States? *</label>
    <select id="auth" required><option>Select...</option><option>Yes</option><option>No</option></select></div>
  <fieldset><legend>Will you now or in the future require visa sponsorship? *</legend>
    <label><input type="radio" name="spons" value="y"> Yes</label>
    <label><input type="radio" name="spons" value="n"> No</label></fieldset>
  <div class="field"><label><input type="checkbox" id="consent" name="consent"> I agree to the privacy policy</label></div>
  <button type="submit">Submit Application</button>
</form>
</body></html>
