# Fly.io config. Change `app` to a unique name, then: fly launch --copy-config --no-deploy
app = "jobpilot-yourname"
primary_region = "sjc"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # must stay on: the scheduler lives inside the app
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "jobpilot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"               # Chromium needs ~1GB
